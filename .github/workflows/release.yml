name: Build and release launcher

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Info.plist'
      - 'build.sh'
      - 'pack.json'
  workflow_dispatch:

jobs:
  release:
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: |
          V=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Info.plist)
          echo "version=$V" >> $GITHUB_OUTPUT

      - name: Build app
        run: |
          chmod +x build.sh
          SDK=$(xcrun --show-sdk-path) VERSION=${{ steps.ver.outputs.version }} ./build.sh

      - name: Package
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent HomeCraft.app HomeCraft.zip
          SHA=$(shasum -a 256 HomeCraft.zip | awk '{print $1}')
          SIZE=$(stat -f%z HomeCraft.zip)
          echo "sha=$SHA" >> $GITHUB_ENV
          echo "size=$SIZE" >> $GITHUB_ENV

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: HomeCraft ${{ steps.ver.outputs.version }}
          files: build/HomeCraft.zip
          fail_on_unmatched_files: true

      - name: Write latest.json
        run: |
          cat > latest.json <<JSON
          {
            "version": "${{ steps.ver.outputs.version }}",
            "url": "https://github.com/albert-moscow/Homecraft/releases/download/v${{ steps.ver.outputs.version }}/HomeCraft.zip",
            "sha256": "${{ env.sha }}",
            "notes": "Автоматическая сборка"
          }
          JSON
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add latest.json
          git commit -m "chore: latest.json for v${{ steps.ver.outputs.version }}" || echo "no changes"
          git push
